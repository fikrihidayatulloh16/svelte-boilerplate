syntax = "proto3";

// Gunakan versioning yang baik
package auth.v1; 

service AuthService {
  // Registrasi pengguna baru
  rpc Register (RegisterRequest) returns (RegisterResponse);

  // Login pengguna
  rpc Login (LoginRequest) returns (LoginResponse);

  // Logout pengguna (Hapus token di sisi server/redis jika perlu)
  rpc Logout (LogoutRequest) returns (LogoutResponse);

  // Refresh Token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// ==========================================
// REGISTER
// ==========================================
message RegisterRequest {
  string email = 1;
  string full_name = 2;
  string password = 3; // Gunakan "password", biarkan server yang tahu itu raw
}

message RegisterResponse {
  // Cukup kembalikan data user yang baru dibuat, 
  // gRPC akan otomatis handle status 200 OK
  UserResponse user = 1; 
}

// ==========================================
// LOGIN
// ==========================================
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string session_token = 1;
  string refresh_token  = 2;
  UserResponse user = 3;
}

// ==========================================
// LOGOUT
// ==========================================
message LogoutRequest {
  string refresh_token = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LogoutResponse {
  bool success = 1;
}

// ==========================================
// Refresh Token
// ==========================================

// ==========================================
// ENTITAS BERSAMA (SHARED)
// ==========================================
// Struct ini bisa dipakai ulang di Register, Login, atau GetMe
message UserResponse {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  
}